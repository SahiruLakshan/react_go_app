name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend
        working-directory: backend
        run: |
          go vet ./...
          go build -o server .

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy
        run: |
          install -m 755 backend/server /opt/reactgoapp/server.new
          mv /opt/reactgoapp/server.new /opt/reactgoapp/server
          rsync -a --delete frontend/dist/ /var/www/reactgoapp/
          sudo systemctl restart reactgoapp